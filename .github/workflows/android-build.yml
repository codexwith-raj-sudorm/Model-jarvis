name: Android build

# The "real Android Studio build", headless: same Gradle assembleDebug that
# Studio runs, on a proper Linux runner with JDK 17 + Android SDK + NDK.
# First-compile iteration loop (P0) — expect fixes until this goes green.
#
# On failure the Gradle log tail is posted as a commit comment (api.github.com)
# so it can be read even from networks where Actions blob storage is blocked.

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:
    inputs:
      full_abis:
        description: "Build all 3 ABIs (arm64 + armv7 + x86_64 — slower)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: jarvis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-flight audit (fix inventory + syntax)
        run: python3 scripts/audit_fixes.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" > /dev/null

      - name: Fetch sherpa-onnx AAR (pinned release)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/sherpa-onnx-1.12.40.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.40/sherpa-onnx-1.12.40.aar"
          ls -la app/libs/

      - name: Cache native build (llama.cpp + CMake artifacts)
        uses: actions/cache@v4
        with:
          path: |
            jarvis/app/.cxx
            jarvis/app/build/intermediates/cxx
          key: native-${{ runner.os }}-b10876-${{ hashFiles('jarvis/app/src/main/cpp/**') }}
          restore-keys: |
            native-${{ runner.os }}-b10876-

      - name: Unit tests (pure-JVM: parsers, ranker, formatter, intents)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK (all ABIs)
        run: |
          set -o pipefail
          chmod +x gradlew
          # full matrix: arm64-v8a + armeabi-v7a + x86_64 — the native cache
          # makes the extra ABIs a one-time cost
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Locate APK (exact path, no glob guessing)
        id: apk
        if: always()
        run: |
          # workspace-wide, absolute — cannot miss wherever AGP put it
          find "$GITHUB_WORKSPACE" -name "*.apk" > ../apk-list.txt 2>/dev/null || true
          echo "APKs found:"; cat ../apk-list.txt || true
          APK=$(head -1 ../apk-list.txt 2>/dev/null || true)

          if [ -n "$APK" ]; then
            REL="${APK#"$GITHUB_WORKSPACE"/}"
            echo "rootpath=$REL" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no APK anywhere in the workspace — dumping build dirs"
            {
              echo "=== ls jarvis/app/build ==="
              ls -laR "$GITHUB_WORKSPACE/jarvis/app/build" 2>&1 | head -200
              echo "=== ls jarvis/app ==="
              ls -la "$GITHUB_WORKSPACE/jarvis/app" 2>&1
            } > ../builddir.txt 2>&1 || true
            if [ "${{ job.status }}" = "success" ]; then exit 1; fi
          fi
          {
            echo "### APK outputs"
            echo '```'
            cat ../apk-list.txt 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: success() && steps.apk.outputs.rootpath != ''
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: ${{ steps.apk.outputs.rootpath }}
          if-no-files-found: error

      - name: Report failure tail (commit comment)
        if: failure()
        run: |
          LOG=../build.log
          {
            echo "### ❌ Build failed — diagnostics (commit ${GITHUB_SHA:0:7})"
            if [ -f ../apk-list.txt ] && [ -s ../apk-list.txt ]; then
              echo "**APKs on disk:**"; echo '```'; cat ../apk-list.txt; echo '```'
            fi
            if [ -f ../builddir.txt ]; then
              echo "**Build dir dump:**"; echo '```'; head -150 ../builddir.txt; echo '```'
            fi
            if [ -f "$LOG" ]; then
              echo "**Gradle log tail:**"
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' "$LOG" | tail -c 28000
              echo '```'
            else
              echo "(no build log captured — failed before/at the build step)"
            fi
          } > /tmp/body.txt
          jq -n --rawfile b /tmp/body.txt '{body: $b}' > /tmp/payload.json
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -d @/tmp/payload.json > /tmp/resp.json
          jq -r '.html_url // (.message // "comment post failed")' /tmp/resp.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
