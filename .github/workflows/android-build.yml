name: Android build

# The "real Android Studio build", headless: same Gradle assembleDebug that
# Studio runs, on a proper Linux runner with JDK 17 + Android SDK + NDK.
# First-compile iteration loop (P0) — expect fixes until this goes green.
#
# On failure the Gradle log tail is posted as a commit comment (api.github.com)
# so it can be read even from networks where Actions blob storage is blocked.

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:
    inputs:
      full_abis:
        description: "Build all 3 ABIs (arm64 + armv7 + x86_64 — slower)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: jarvis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1" > /dev/null

      - name: Fetch sherpa-onnx AAR (pinned release)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/sherpa-onnx-1.12.40.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.12.40/sherpa-onnx-1.12.40.aar"
          ls -la app/libs/

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          if [ "${{ inputs.full_abis }}" = "true" ]; then
            ./gradlew assembleDebug --stacktrace 2>&1 | tee ../build.log
          else
            # fast iteration: one ABI; flip via workflow_dispatch for the
            # full matrix once the build is green
            ./gradlew assembleDebug --stacktrace -Pandroid.injected.build.abi=arm64-v8a 2>&1 | tee ../build.log
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Report failure tail (commit comment)
        if: failure()
        run: |
          LOG=../build.log
          if [ ! -f "$LOG" ]; then echo "no build log captured"; exit 0; fi
          # strip ANSI colors, keep the last 28000 chars
          sed 's/\x1b\[[0-9;]*m//g' "$LOG" | tail -c 28000 > /tmp/tail.txt
          {
            echo "### ❌ Gradle failure — log tail (commit ${GITHUB_SHA:0:7})"
            echo '```'
            cat /tmp/tail.txt
            echo '```'
          } > /tmp/body.txt
          jq -n --rawfile b /tmp/body.txt '{body: $b}' > /tmp/payload.json
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -d @/tmp/payload.json > /tmp/resp.json
          jq -r '.html_url // (.message // "comment post failed")' /tmp/resp.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
